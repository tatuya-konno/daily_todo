<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>今日やること</title>

    <style>

        body {
            font-family: sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 30px 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        form {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .weekdays {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .weekdays label {
            background: #eee;
            padding: 8px 10px;
            border-radius: 6px;
        }

        form button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
        }

        .todo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 18px;
            margin-bottom: 12px;
            border-radius: 10px;
            font-size: 20px;
        }

        .todo span {
            flex: 1;
            cursor: pointer;
        }

        .todo button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #ddd;
        }

        .done {
            text-decoration: line-through;
            color: #999;
        }

    </style>
</head>

<body>

    <h1>今日やること</h1>

    <form action="/add" method="POST">

        <input
            type="text"
            name="name"
            placeholder="やることを入力"
            required
        >

        <select name="todo_type" id="todo_type">

            <option value="weekday">
                曜日指定
            </option>

            <option value="today">
                今日だけ
            </option>

            <option value="always">
                いつでも
            </option>

        </select>

        <div class="weekdays" id="weekdays">

            <label>
                <input type="checkbox" name="weekdays" value="0">
                月
            </label>

            <label>
                <input type="checkbox" name="weekdays" value="1">
                火
            </label>

            <label>
                <input type="checkbox" name="weekdays" value="2">
                水
            </label>

            <label>
                <input type="checkbox" name="weekdays" value="3">
                木
            </label>

            <label>
                <input type="checkbox" name="weekdays" value="4">
                金
            </label>

            <label>
                <input type="checkbox" name="weekdays" value="5">
                土
            </label>

            <label>
                <input type="checkbox" name="weekdays" value="6">
                日
            </label>

        </div>

        <button type="submit">
            追加
        </button>

    </form>


    {% for todo in todos %}

        <div class="todo {% if todo['done'] %}done{% endif %}">

            <span onclick="location.href='/toggle/{{ todo['id'] }}'">

                {% if todo['done'] %}
                    ☑
                {% else %}
                    ☐
                {% endif %}

                {{ todo['name'] }}

            </span>

            <button onclick="location.href='/delete/{{ todo['id'] }}'">
                削除
            </button>

        </div>

    {% endfor %}


    <script>

        const typeSelect = document.getElementById("todo_type");
        const weekdays = document.getElementById("weekdays");

        function updateWeekdays() {

            if (typeSelect.value === "weekday") {
                weekdays.style.display = "flex";
            } else {
                weekdays.style.display = "none";
            }

        }

        typeSelect.addEventListener("change", updateWeekdays);

        updateWeekdays();

    </script>

</body>

</html>
